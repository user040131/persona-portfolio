# 제안 화면 안내
help.R1=이 종목을 주식 안 한도까지 줄이고, 줄인 만큼을 다른 추천 종목에 비중대로 나눠요. 채권·현금의 목표 비중은 그대로이고, 지금 비중이 목표와 다르면 함께 맞춰요.
help.R2=이 업종 종목들을 한도까지 줄이고, 줄인 만큼을 다른 업종 추천 종목에 나눠요. 채권·현금의 목표 비중은 그대로이고, 지금 비중이 목표와 다르면 함께 맞춰요.
help.R3=매수 완료 때 정한 목표 비중으로 되돌려요.
help.R4=매수 완료 때 정한 목표 비중으로 되돌려 안전자산을 채워요.
help.R5=매수 완료 때 정한 목표 비중으로 되돌려요. 계속 걱정되면 성향을 다시 진단해 보세요.
help.R6=같은 성향으로 지금 총액을 처음부터 다시 짠 결과예요. 순위에서 밀린 종목을 바꾸는 제안은 정기 점검 때만 해요.
help.R7=이 종목을 모두 팔고, 그 돈을 다른 추천 종목에 비중대로 나눠요.

