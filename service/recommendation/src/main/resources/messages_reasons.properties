stock.role.OVERLAP=갖고 계신 업종({sector})과 겹쳐요

# ---- 포트폴리오 근거 ----
alloc.cash=현금 {cash:%0}: 1년 안에 쓸 돈이 '{a2Text}'라고 하셔서 바로 꺼낼 수 있게 남겼어요
alloc.cash.none=현금 {cash:%0}: 1년 안에 쓸 돈이 없다고 하셔서 따로 떼어 두지 않았어요
alloc.cash.noneBut=현금 {cash:%0}: 1년 안에 쓸 돈은 없다고 하셨어요
alloc.cash.extra.LOSS_LIMIT=. 채권도 금리가 오르면 값이 떨어지므로, 손실 한도를 지키려고 {extra:%0}p를 더 현금으로 뒀어요
alloc.cash.extra.ALL_CASH=. 손실 한도를 지키려고 {extra:%0}p를 더 현금으로 뒀어요
alloc.cash.extra.USER=. 직접 정하신 안전자산 비중에 맞춰 {extra:%0}p를 더 뒀어요
alloc.cash.extra.CAP=. 그 밖에 {extra:%0}p를 더 현금으로 뒀어요
alloc.cash.noEmergency=. 비상금이 없다고 하셔서 5%p를 더 뒀어요
alloc.bond=채권 {bond:%0}: 흔들림을 줄이려고 담았어요
alloc.binding.LOSS_LIMIT=말씀하신 손실 한도({lossLimit:%0})를 넘지 않도록, 예측이 빗나갈 때를 대비해 여유를 두고 주식을 {stock:%0}로 정했어요. {startYear}년 이후 시장을 그대로 겪었다면 최대 하락폭은 {expectedMdd:%0.0}예요
alloc.binding.LOSS_LIMIT.noStock=말씀하신 손실 한도({lossLimit:%0})에 여유를 두면 주식을 담기 어려워 채권과 현금으로만 나눴어요. {startYear}년 이후 시장을 그대로 겪었다면 최대 하락폭은 {expectedMdd:%0.0}예요
alloc.binding.CAP={gradeLabel}의 주식 상한 {stockCap:%0}에 맞췄어요
alloc.binding.USER=직접 정하신 안전자산 비중을 따랐어요
alloc.binding.USER.exceeded=. 다만 말씀하신 손실 한도를 넘을 수 있어요
alloc.binding.ALL_CASH=말씀하신 손실 한도 안에서는 주식과 채권을 담기 어려워 현금으로 두었어요
alloc.count='{a5Text}' 관리할 수 있다고 하셔서 {nFinal}종목으로 나눴어요
alloc.count.any=종목 수는 상관없다고 하셔서 {nFinal}종목으로 나눴어요
alloc.count.reduced=. 주식 몫이 작아 종목당 50만 원 이상이 되도록 줄였어요
alloc.method={gradeLabel}이라 '{methodLabel}' 방식을 기본으로 보여드려요
alloc.method.user=직접 고르신 '{methodLabel}' 방식으로 보여드려요
alloc.skipped=빠진 종목: {items}
alloc.skipped.item={label} {count}개
alloc.rounding=주식 수를 맞추고 남은 {cashFromRounding:#,###}원은 현금에 더했어요

# 빠진 종목 요약 라벨
skipped.HIGH_VOLATILITY=변동성이 큼
skipped.OVERHEATED=단기 과열
skipped.EXCLUDED_SECTOR=제외한 업종
skipped.USER_REMOVED=직접 뺌
skipped.SECTOR_LIMIT=업종 한도
skipped.PRICE_TOO_HIGH=1주 가격이 큼

