# 추천 근거·왜 없나요·경고 문구 (docs/03 §6.3). UTF-8로 읽는다.
# {이름:형식} 형식: %0 백분율 소수 0자리, %0.0 1자리, +%0.0 부호 포함, 0.0·0.00 소수, #,### 천 단위 쉼표

# ---- 라벨 ----
factor.VALUE=가치
factor.QUALITY=수익성
factor.MOMENTUM=추세
factor.STABILITY=안정성
factor.DIVIDEND=배당
method.EQUAL=동일가중
method.INVERSE_VOL=변동성 역수가중
method.MIN_VARIANCE=최소분산
group.__ALL__=전체 후보
asset.stock=주식
asset.bond=채권
asset.cash=현금

# ---- 종목 근거 ----
stock.selection={group} {groupN}개 종목 중 {factors} 점수가 높아요 (업종 안 {rankInGroup}위)
stock.level.per=이익 대비 주가(PER) {per:0.0}배
stock.level.pbr=자산 대비 주가(PBR) {pbr:0.00}배
stock.level.roe=자기자본이익률(ROE) {roe:%0.0}
stock.link.VALUE={gradeLabel}이라 싸게 거래되는 회사를 중요하게 봤어요. PER이 업종 상위 {pctTop:%0}예요
stock.link.QUALITY=돈을 잘 버는 회사를 중요하게 봤어요. ROE가 업종 상위 {pctTop:%0}예요
stock.link.MOMENTUM=최근 오르는 흐름을 중요하게 봤어요. 6개월 수익률이 {value:+%0.0}예요
stock.link.STABILITY={gradeLabel}이라 빚이 적은 회사를 중요하게 봤어요. 부채비율이 업종 상위 {pctTop:%0}예요
stock.link.DIVIDEND=배당을 많이 주는 회사를 중요하게 봤어요. 배당수익률 {value:%0.0}예요
stock.caution.HIGH_VOL=최근 1년 변동성이 {vol1y:%0}로 큰 편이에요
stock.caution.OVERHEAT=단기 과열 신호가 있어요 (RSI {rsi14:0.00})
stock.caution.WEAK_FACTOR={factorLabel} 점수는 업종 하위 30%예요
stock.role.HELD=이미 갖고 계신 종목이에요
stock.role.NO_HOLDINGS=보유 종목이 없어 분산 효과는 따로 보지 않았어요
