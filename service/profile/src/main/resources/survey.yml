# 투자 성향 설문 (docs/03 §5.1). app의 application.yml이 spring.config.import로 읽는다.
# 7문항은 강의 자료(투자성향_자산배분.pptx) 원문. 모든 문항에서 1번이 가장 공격적, 5번이 가장 보수적.
survey:
  option-scores: [5, 4, 2, 1, 0]          # 결정 3-2
  stable-max: 10                          # 총점 ≤ 10 안정추구형
  aggressive-min: 25                      # 총점 ≥ 25 공격추구형
  grades:
    STABLE:
      label: 안정추구형
      description: 약간의 리스크만을 허용하고, 물가수준 이상의 수익을 추구하는 투자자
    NEUTRAL:
      label: 위험중립형
      description: 적당한 리스크를 허용하여 장기적으로 완만한 수익을 추구하는 투자자
    AGGRESSIVE:
      label: 공격추구형
      description: 금융시장의 큰 변동성을 감수하면서 고수익을 기대하는 투자자
  questions:
    - id: q1
      text: 당신의 나이는?
      options: [44세 이하, 45~55세, 56~65세, 66~75세, 76세 이상]
    - id: q2
      text: 당신의 투자 기간은?
      options: [20년 이상, 11~19년, 6~10년, 1~5년, 1년 이내]
    - id: q3
      text: 당신이 우선 고려하는 투자는?
      options: [무조건 수익률 우선, 원금보전 고려하나 수익률 우선, 수익률과 원금보전 동일하게 고려, 수익률 고려하나 원금보전 우선, 어떤 경우라도 원금보전 우선]
    - id: q4
      text: 정상적인 주식시장 상황에서 이번 투자에서 기대하는 수익은?
      options: [시장 수익률은 상회해야 한다, 시장 수익률 수준은 따라가야 한다, 시장 수익률을 하회해도 평균적인 수익은 내야 한다, 어느 정도의 안정성과 평균적인 수익은 내야 한다, 안정성이 확보되면서 약간의 수익은 내야 한다]
    - id: q5
      text: 향후 10년간 주식시장 침체가 예상될 때 나의 투자성과는?
      options: [부진할 수 있다, 원금 수준은 유지해야 한다, 약간의 수익은 나야 한다, 꽤 괜찮은 수익을 기대한다, 어떤 경우라도 수익이 나야 한다]
    - id: q6
      text: 향후 3년 투자 시 투자성과에 대한 당신의 생각은?
      options: [원금 손실 가능성 인정, 대부분의 손실은 감내 가능, 약간의 손실은 감내 가능, 어떤 손실도 감내 어려움, 약간의 수익이라도 내야]
    - id: q7
      text: 향후 3개월 투자 시 투자손실에 대한 당신의 생각은?
      options: [시장변화에 크게 신경 쓰지 않는다, 20% 이상 손실 발생 시 걱정한다, 10% 이상 손실 발생 시 걱정한다, 작은 시장변화는 감내한다, 어떤 투자손실도 견디기 힘들다]
  extras:
    - id: a2
      text: 이 돈 중 1년 안에 쓸 계획이 있는 금액은?
      options: [없음, 10% 이하, 10~30%, 30% 이상]
    - id: a3
      text: 이 돈과 별도로 비상금(생활비 3~6개월치)이 있나요?
      options: [있다, 없다]
    - id: a4
      text: 이 투자금이 전체 금융자산에서 차지하는 비중은?
      options: [20% 이하, 20~50%, 50~80%, 80% 이상]
    - id: a5
      text: 몇 종목까지 신경 쓸 수 있나요?
      options: [10개 안팎, 15개 안팎, 20개 이상, 상관없음]
    - id: a6
      text: 끌리는 투자 스타일은? (여러 개 선택)
      multi: true
      keyed-options:
        - { key: VALUE, text: 싸게 사기 }
        - { key: QUALITY, text: 돈 잘 버는 회사 }
        - { key: MOMENTUM, text: 오르는 종목 }
        - { key: STABILITY, text: 빚 적은 회사 }
        - { key: DIVIDEND, text: 배당 }
        - { key: ANY, text: 상관없음 }
    - id: a7
      text: 투자하고 싶지 않은 업종은? (선택 안 해도 돼요)
      multi: true
      options-from: sectors
