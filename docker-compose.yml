# 로컬 개발용 (docs/02 §8). 지금은 MySQL과 Python 엔진을 띄운다.
# Spring 서비스는 개발 중이라 호스트에서 ./gradlew :app:bootRun으로 띄운다(컨테이너는 나중에 추가).

# 폴더 이름(한글)으로는 프로젝트 이름을 만들 수 없어서 직접 정한다
name: team2-portfolio

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_pw}"
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      # 3306은 PC에 설치된 MySQL과 겹칠 수 있어 3307로 연다
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  quant-engine:
    build: ./quant-engine
    environment:
      DATABASE_URL: "mysql+pymysql://quant_user:${QUANT_DB_PASSWORD:-quant_pw}@mysql:3306/market?charset=utf8mb4"
      QUANT_SERVICE_KEY: "${QUANT_SERVICE_KEY:-dev-only-change-me}"
      DATA_GO_KR_KEY: "${DATA_GO_KR_KEY:-}"
      ECOS_KEY: "${ECOS_KEY:-}"
      DART_KEY: "${DART_KEY:-}"
    volumes:
      - ./quant-engine/data:/app/data      # 제공 파일(data/raw)과 리포트
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 운영에서는 열지 않는다(내부망 전용). 지금은 호스트에서 띄운 Spring이 부르도록 로컬에만 연다
      - "127.0.0.1:8000:8000"

volumes:
  mysql-data: {}
